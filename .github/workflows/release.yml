name: Release

# kimi.plugin.json 的 version 是插件发版的唯一事实来源:
# 它在 main 上变化时,自动打 v<version> 标签并建 GitHub Release。
# /plugins install <github-url> 优先装 latest release,没有才退回默认分支。

on:
  push:
    branches: [main]
    paths: ['kimi.plugin.json']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          v=$(python3 -c "import json; print(json.load(open('kimi.plugin.json'))['version'])")
          tag="v$v"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --generate-notes
