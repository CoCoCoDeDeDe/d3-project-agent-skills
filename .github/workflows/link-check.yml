name: Doc link check

on:
  push:
    paths: ['skills/babylon-cad/references/doc-urls.md']
  pull_request:
    paths: ['skills/babylon-cad/references/doc-urls.md']
  schedule:
    # 每周一 03:17 UTC 跑一次——官方文档改版导致的死链不等人改仓库
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all doc-urls.md paths resolve
        run: scripts/check-doc-urls.sh
